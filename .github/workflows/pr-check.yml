name: PR Check

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description is filled in
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const stripped = body
              .replace(/<!--.*?-->/gs, '')
              .replace(/^[-\s\[\]xX#*_]/gm, '')
              .trim();

            if (stripped.length < 30) {
              core.setFailed(
                'PR description is too short or only contains the template placeholders. ' +
                'Please fill in the Description and Changes Made sections.'
              );
            }

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run contract tests
        run: cargo test --locked

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: fnm/actions/setup@v1
        with:
          version: 20.19.0

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
